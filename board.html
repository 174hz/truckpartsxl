<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruckPartsXL | Live Bounty Board</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/list.js/2.3.1/list.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh;
            background-color: #0d1b2a; 
        }
        
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://images.unsplash.com/photo-1591768793355-74d04bb6608f?q=80&w=2070'); 
            background-size: cover; background-position: center 20%; opacity: 0.2; z-index: -1;
        }

        nav { 
            background-color: #1d3557; width: 100%; padding: 12px 30px; 
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 10; box-sizing: border-box;
        }

        .logo { font-size: 1.6rem; font-weight: 900; letter-spacing: -1px; text-decoration: none; }
        .logo-truck { color: #ffffff; } .logo-parts { color: #a8dadc; } .logo-xl { color: #e63946; }

        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: white; text-decoration: none; font-weight: bold; text-transform: uppercase; font-size: 0.8rem; }
        
        .header { background-color: rgba(255, 255, 255, 0.98); color: #1d3557; width: 100%; padding: 35px 0; text-align: center; border-bottom: 3px solid #e63946; }

        .search-wrapper { width: 95%; max-width: 900px; margin: -25px auto 40px; }
        .search { 
            width: 100%; padding: 18px; border-radius: 8px; border: 3px solid #39FF14; 
            background: white; font-size: 1.1rem; font-weight: bold; box-shadow: 0 10px 30px rgba(0,0,0,0.3); outline: none;
        }

        .board-container { width: 95%; max-width: 1000px; margin: 0 auto; flex-grow: 1; }
        .list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 15px; }

        /* THE TIDY CARD */
        .post-card { 
            background: white; color: #1d3557; padding: 20px; border-radius: 8px; 
            display: flex; flex-direction: column; position: relative; border-left: 6px solid #1d3557;
        }
        
        .boosted { 
            background-color: #fbff00 !important; border-left: 6px solid #39FF14 !important;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.4);
        }
        .priority-badge { 
            display: none; background: #e63946; color: white; padding: 3px 10px; 
            font-size: 0.65rem; font-weight: 900; border-radius: 3px; 
            position: absolute; top: -10px; right: 15px; 
        }
        .boosted .priority-badge { display: block; }

        .part-title { font-size: 1.3rem; font-weight: 900; text-transform: uppercase; margin: 0 0 12px 0; color: #1d3557; border-bottom: 1px solid #ddd; padding-bottom: 5px; }

        /* DATA GRID - 4 Columns for Desktop, 2 for Mobile */
        .data-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 12px; 
        }
        .data-item { display: flex; flex-direction: column; }
        .label { font-size: 0.65rem; font-weight: 800; color: #457b9d; text-transform: uppercase; letter-spacing: 0.5px; }
        .value { font-size: 0.95rem; font-weight: 600; color: #1d3557; }
        .budget-value { color: #2a9d8f; font-weight: 800; }

        footer { background-color: #1d3557; color: white; width: 100%; padding: 30px 0; text-align: center; border-top: 2px solid #a8dadc; margin-top: 50px; }
        .footer-links a { color: #a8dadc; margin: 0 15px; text-decoration: none; font-size: 0.85rem; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">
            <span class="logo-truck">TRUCK</span><span class="logo-parts">PARTS</span><span class="logo-xl">XL</span>
        </a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="board.html">Bounty Board</a>
            <a href="privacy.html">Privacy</a>
            <a href="terms.html">Terms</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <div class="header">
        <h1 style="margin:0;">Live Bounty Board</h1>
        <p style="margin:5px 0 0;">North American Heavy-Duty Parts Marketplace</p>
    </div>

    <div id="bounty-engine">
        <div class="search-wrapper">
            <input class="search" placeholder="🔍 Search Part, OEM, Category, Year, or Location...">
        </div>

        <div class="board-container">
            <ul class="list" id="parts-data">
                <p style="text-align:center; color:white;">Syncing Bounties...</p>
            </ul>
        </div>
    </div>

    <footer>
        <div class="footer-links">
            <a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms of Service</a> | <a href="contact.html">Contact & Support</a>
        </div>
    </footer>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTYrAOOtTGO2mCi3sqBNaWAoM8PM8srskGBywloCDjBAgTH9BwzWlhQiWM2KNWy3uzds53j8rCcIsPG/pub?gid=796391633&single=true&output=csv';

        async function fetchSheet() {
            try {
                const response = await fetch(CSV_URL);
                const text = await response.text();
                const rows = text.split('\n').slice(1);
                let html = '';

                rows.forEach(row => {
                    const cols = row.match(/(".*?"|[^",\r\n]+)(?=\s*,|\s*$)/g);
                    if (!cols || cols.length < 9) return;

                    // MAPPING THE FIRST 8 COLUMNS (B through I)
                    const partName = cols[1]?.replace(/"/g, '') || "N/A";
                    const oem      = cols[2]?.replace(/"/g, '') || "N/A";
                    const category = cols[3]?.replace(/"/g, '') || "N/A";
                    const year     = cols[4]?.replace(/"/g, '') || "N/A";
                    const make     = cols[5]?.replace(/"/g, '') || "N/A";
                    const model    = cols[6]?.replace(/"/g, '') || "N/A";
                    const location = cols[7]?.replace(/"/g, '') || "N/A";
                    const budget   = cols[8]?.replace(/"/g, '') || "Quote Req";
                    const boost    = cols[11]?.replace(/"/g, '') || "";

                    const isBoosted = boost.includes("🚀");

                    html += `
                        <li class="post-card ${isBoosted ? 'boosted' : ''}">
                            <span class="priority-badge">🔥 PRIORITY BOUNTY</span>
                            <h3 class="part-title s-part">${partName}</h3>
                            <div class="data-grid">
                                <div class="data-item"><span class="label">OEM Number</span><span class="value s-oem">${oem}</span></div>
                                <div class="data-item"><span class="label">Category</span><span class="value s-cat">${category}</span></div>
                                <div class="data-item"><span class="label">Year</span><span class="value s-year">${year}</span></div>
                                <div class="data-item"><span class="label">Make</span><span class="value s-make">${make}</span></div>
                                <div class="data-item"><span class="label">Model</span><span class="value s-model">${model}</span></div>
                                <div class="data-item"><span class="label">Location</span><span class="value s-loc">${location}</span></div>
                                <div class="data-item"><span class="label">Target Budget</span><span class="value budget-value s-budget">${budget}</span></div>
                            </div>
                        </li>`;
                });

                document.getElementById('parts-data').innerHTML = html;
                new List('bounty-engine', { valueNames: ['s-part', 's-oem', 's-cat', 's-year', 's-make', 's-model', 's-loc', 's-budget'] });
            } catch (e) { console.error("Sync Failure:", e); }
        }
        fetchSheet();
    </script>
</body>
</html>
