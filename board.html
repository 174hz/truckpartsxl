<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruckPartsXL | Live Bounty Board</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/list.js/2.3.1/list.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background-color: #0d1b2a; color: white; margin: 0; 
            padding-bottom: 50px; 
        }
        
        .header-box { text-align: center; padding: 60px 20px; background: #1d3557; border-bottom: 4px solid #e63946; }
        
        /* THE SEARCH BOX */
        .search-wrapper { width: 90%; max-width: 800px; margin: -30px auto 40px; position: relative; z-index: 100; }
        .search { 
            width: 100%; padding: 22px; border-radius: 50px; border: 4px solid #39FF14; 
            background: white; color: #1d3557; font-size: 1.2rem; font-weight: bold;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); outline: none; box-sizing: border-box;
        }

        .board-container { width: 95%; max-width: 900px; margin: 0 auto; }
        .list { list-style: none; padding: 0; }

        /* POST CARD STYLING */
        .post-card { 
            background: white; color: #1d3557; margin-bottom: 15px; 
            padding: 25px; border-radius: 12px; display: flex; 
            flex-direction: column; position: relative; transition: 0.3s;
        }

        /* NEON BOOSTED STYLE */
        .boosted { 
            background-color: #fbff00 !important; /* Fluorescent Yellow */
            border: 4px solid #39FF14 !important; /* Neon Green Border */
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.7);
            transform: scale(1.02);
            z-index: 5;
        }
        .boosted .priority-badge { display: block; }
        .priority-badge {
            display: none; background: #e63946; color: white; 
            padding: 5px 12px; font-size: 0.75rem; font-weight: 900;
            border-radius: 4px; position: absolute; top: -12px; left: 20px;
        }

        .part-header { font-size: 1.6rem; font-weight: 900; text-transform: uppercase; margin: 0; color: #1d3557; }
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; font-size: 0.95rem; }
        .label { font-weight: bold; color: #457b9d; text-transform: uppercase; font-size: 0.75rem; display: block; }
        .value { color: #1d3557; font-weight: 600; }
    </style>
</head>
<body>

    <div class="header-box">
        <h1 style="margin:0; font-size: 2.5rem;">BOUNTY BOARD</h1>
        <p style="opacity: 0.8;">Active Heavy-Duty Parts Requests Across North America</p>
    </div>

    <div id="bounty-system">
        <div class="search-wrapper">
            <input class="search" placeholder="🔍 Search by OEM#, Part Name, Truck Model, or Category...">
        </div>

        <div class="board-container">
            <ul class="list" id="inject-rows">
                <p style="text-align:center;">Syncing with live inventory...</p>
            </ul>
        </div>
    </div>

    <script>
        // PASTE YOUR CSV LINK HERE
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTYrAOOtTGO2mCi3sqBNaWAoM8PM8srskGBywloCDjBAgTH9BwzWlhQiWM2KNWy3uzds53j8rCcIsPG/pub?gid=796391633&single=true&output=csv';

        async function loadBounties() {
            try {
                const response = await fetch(CSV_URL);
                const csvData = await response.text();
                const lines = csvData.split('\n').slice(1); // Remove header
                
                let boardHtml = '';

                lines.forEach(line => {
                    // This handles commas inside quotes correctly
                    const parts = line.match(/(".*?"|[^",\r\n]+)(?=\s*,|\s*$)/g);
                    if (!parts || parts.length < 12) return;

                    const partName = parts[1]?.replace(/"/g, '') || "N/A";
                    const oem = parts[2]?.replace(/"/g, '') || "N/A";
                    const category = parts[3]?.replace(/"/g, '') || "N/A";
                    const truck = parts[4]?.replace(/"/g, '') || "N/A";
                    const boostValue = parts[11]?.replace(/"/g, '') || ""; // Column L

                    const isBoosted = boostValue.includes("🚀");
                    const cardClass = isBoosted ? 'boosted' : '';

                    boardHtml += `
                        <li class="post-card ${cardClass}">
                            <span class="priority-badge">🔥 PRIORITY BOUNTY</span>
                            <h3 class="part-header part-search">${partName}</h3>
                            <div class="details-grid">
                                <div><span class="label">OEM Number</span><span class="value oem-search">${oem}</span></div>
                                <div><span class="label">Category</span><span class="value cat-search">${category}</span></div>
                                <div><span class="label">Truck Make/Model</span><span class="value truck-search">${truck}</span></div>
                            </div>
                        </li>
                    `;
                });

                document.getElementById('inject-rows').innerHTML = boardHtml;

                // ACTIVATES THE SEARCH BAR
                new List('bounty-system', {
                    valueNames: ['part-search', 'oem-search', 'cat-search', 'truck-search']
                });

            } catch (err) {
                console.error("Board sync failed:", err);
            }
        }

        loadBounties();
    </script>
</body>
</html>
