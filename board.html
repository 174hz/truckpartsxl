<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruckPartsXL | North American Bounty Board</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/list.js/2.3.1/list.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh;
            background-color: #0d1b2a; 
        }
        
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://images.unsplash.com/photo-1591768793355-74d04bb6608f?q=80&w=2070'); 
            background-size: cover; background-position: center 20%; opacity: 0.15; z-index: -1;
        }

        nav { 
            background-color: #1d3557; width: 100%; padding: 12px 30px; 
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 10; box-sizing: border-box;
        }

        .logo { font-size: 1.6rem; font-weight: 900; letter-spacing: -1px; text-decoration: none; }
        .logo-truck { color: #ffffff; } .logo-parts { color: #a8dadc; } .logo-xl { color: #e63946; }

        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: white; text-decoration: none; font-weight: bold; text-transform: uppercase; font-size: 0.8rem; transition: 0.3s; }
        .nav-links a:hover { color: #a8dadc; }
        
        .header { background-color: rgba(255, 255, 255, 0.98); color: #1d3557; width: 100%; padding: 35px 0; text-align: center; border-bottom: 3px solid #e63946; }

        .search-wrapper { width: 95%; max-width: 900px; margin: -25px auto 40px; }
        .search { 
            width: 100%; padding: 18px; border-radius: 8px; border: 3px solid #39FF14; 
            background: white; color: #1d3557; font-size: 1.1rem; font-weight: bold; box-shadow: 0 10px 30px rgba(0,0,0,0.3); outline: none;
        }

        .board-container { width: 95%; max-width: 1100px; margin: 0 auto; flex-grow: 1; }
        .list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 15px; }

        .post-card { 
            background: white; color: #1d3557; padding: 25px; border-radius: 8px; 
            display: flex; flex-direction: column; position: relative; 
            border-left: 6px solid #1d3557; transition: all 0.25s ease-in-out;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        
        .post-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.1);
        }
        
        .boosted { 
            background-color: #ffffff !important; 
            border-left: 8px solid #ff4757 !important; 
            box-shadow: 0 10px 25px rgba(255, 71, 87, 0.15) !important; 
            position: relative; overflow: hidden;
        }

        .boosted::after {
            content: ''; position: absolute; top: 0; right: 0; width: 150px; height: 150px;
            background: linear-gradient(135deg, rgba(255,71,87,0.05) 0%, rgba(255,71,87,0) 100%);
            pointer-events: none;
        }

        .priority-badge { 
            display: none; background: linear-gradient(135deg, #ff4757, #ff6b81); color: #ffffff; 
            padding: 6px 14px; font-size: 0.75rem; font-weight: 900; border-radius: 0 0 0 8px; 
            position: absolute; top: 0; right: 0; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: -2px 2px 5px rgba(0,0,0,0.1);
        }
        .boosted .priority-badge { display: block; }

        .part-title { font-size: 1.5rem; font-weight: 900; text-transform: uppercase; margin: 0 0 4px 0; color: #1d3557; }
        .vehicle-fitment { font-size: 0.95rem; font-weight: 600; color: #457b9d; margin: 0 0 15px 0; padding-bottom: 10px; border-bottom: 1px solid #eef2f5; }

        .data-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 15px; 
        }
        .data-item { display: flex; flex-direction: column; }
        .label { font-size: 0.65rem; font-weight: 800; color: #6c757d; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
        .value { font-size: 1.05rem; font-weight: 700; color: #1d3557; word-break: break-all; }
        .budget-value { color: #2e7d32; font-weight: 800; font-size: 1.2rem; }

        footer { background-color: #1d3557; color: white; width: 100%; padding: 30px 0; text-align: center; border-top: 2px solid #a8dadc; margin-top: 50px; }
        .footer-links a { color: #a8dadc; margin: 0 15px; text-decoration: none; font-size: 0.85rem; }

        @media (max-width: 768px) {
            nav { padding: 12px 15px; flex-direction: column; gap: 10px; }
            .header { padding: 25px 15px; }
            .search-wrapper { margin: -15px auto 25px; }
            .search { padding: 14px; font-size: 1rem; }
            .post-card { padding: 18px; border-left-width: 4px; }
            .boosted { border-left-width: 6px !important; }
            
            .data-grid { grid-template-columns: 1fr; gap: 10px; }
            .data-item {
                flex-direction: row; justify-content: space-between; align-items: center;
                border-bottom: 1px dashed #eef2f5; padding-bottom: 6px;
            }
            .label { margin-bottom: 0; }
            .value { font-size: 0.95rem; text-align: right; }
            .budget-value { font-size: 1.05rem; }
            .part-title { font-size: 1.25rem; padding-right: 120px; }
            .vehicle-fitment { font-size: 0.85rem; margin-bottom: 10px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">
            <span class="logo-truck">TRUCK</span><span class="logo-parts">PARTS</span><span class="logo-xl">XL</span>
        </a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="board.html">Bounty Board</a>
            <a href="privacy.html">Privacy</a>
            <a href="terms.html">Terms</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <div class="header">
        <h1 style="margin:0; text-transform: uppercase; letter-spacing: 1px;">Master North American Bounty Board</h1>
        <p style="margin:5px 0 0; font-weight: 500;">Cross-Border Heavy Duty Sourcing Feed</p>
    </div>

    <div id="bounty-engine">
        <div class="search-wrapper">
            <input class="search" placeholder="🔍 Search Master Feed by Part, OEM, Make, Region, Location...">
        </div>

        <div class="board-container">
            <ul class="list" id="parts-data">
                <p style="text-align:center; color:white;">Syncing North American Bounties...</p>
            </ul>
        </div>
    </div>

    <footer>
        <div class="footer-links">
            <a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms of Service</a> | <a href="contact.html">Contact & Support</a>
        </div>
    </footer>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTYrAOOtTGO2mCi3sqBNaWAoM8PM8srskGBywloCDjBAgTH9BwzWlhQiWM2KNWy3uzds53j8rCcIsPG/pub?gid=1699339913&single=true&output=csv';

        function parseCSVLine(text) {
            let p = '', c = '', r = [];
            let q = false;
            for (let i = 0; i < text.length; i++) {
                c = text[i];
                if (c === '"') { q = !q; }
                else if (c === ',' && !q) { r.push(p.trim()); p = ''; }
                else if (c === '\r' || c === '\n') { }
                else { p += c; }
            }
            r.push(p.trim());
            return r;
        }

        async function fetchSheet() {
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const text = await response.text();
                
                const rows = text.split('\n').slice(1);
                let html = '';
                let validCount = 0;

                rows.forEach(row => {
                    if (!row.trim()) return;
                    const cols = parseCSVLine(row);
                    if (cols.length < 2 || !cols[1]) return; 

                    // Corrected Column Mapping Mapping Strategy
                    const partName = cols[1] || "N/A";
                    const oem      = cols[2] || "N/A";
                    const category = cols[3] || "N/A";
                    const year     = cols[4] || "N/A";
                    const make     = cols[5] || "N/A";
                    const model    = cols[6] || "N/A";
                    const location = cols[7] || "N/A";
                    const budget   = cols[8] || "Contact for Quote";
                    const boost    = cols[11] || "";

                    const isBoosted = boost.includes("🚀");
                    validCount++;

                    html += `
                        <li class="post-card ${isBoosted ? 'boosted' : ''}">
                            <div class="priority-badge">Priority Bounty</div>
                            <h3 class="part-title s-part">${partName}</h3>
                            <div class="vehicle-fitment s-fitment">${year} ${make} ${model}</div>
                            <div class="data-grid">
                                <div class="data-item"><span class="label">OEM / Casting Number</span><span class="value s-oem">${oem}</span></div>
                                <div class="data-item"><span class="label">Category Component</span><span class="value s-cat">${category}</span></div>
                                <div class="data-item"><span class="label">Delivery Location</span><span class="value s-loc">${location}</span></div>
                                <div class="data-item"><span class="label">Target Budget</span><span class="value budget-value s-budget">${budget}</span></div>
                            </div>
                        </li>`;
                });

                if(validCount === 0) {
                    document.getElementById('parts-data').innerHTML = '<p style="text-align:center; color:white;">No active bounties listed in the network yet.</p>';
                    return;
                }

                document.getElementById('parts-data').innerHTML = html;
                new List('bounty-engine', { 
                    valueNames: ['s-part', 's-fitment', 's-oem', 's-cat', 's-loc', 's-budget'] 
                });

            } catch (e) { 
                console.error("Sync Failure:", e);
                document.getElementById('parts-data').innerHTML = '<p style="color:white; text-align:center;">Checking for local bounty updates...</p>';
            }
        }
        fetchSheet();
    </script>
</body>
</html>
