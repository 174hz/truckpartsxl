<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruckPartsXL | Live Bounty Board</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/list.js/2.3.1/list.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; padding: 0; 
            display: flex; flex-direction: column; min-height: 100vh;
            background-color: #0d1b2a; 
        }
        
        /* BACKGROUND CLARITY */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://images.unsplash.com/photo-1591768793355-74d04bb6608f?q=80&w=2070'); 
            background-size: cover; background-position: center 20%; opacity: 0.3; z-index: -1;
        }

        nav { 
            background-color: #1d3557; width: 100%; padding: 12px 30px; 
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 10; box-sizing: border-box;
        }

        .logo { font-size: 1.6rem; font-weight: 900; letter-spacing: -1px; text-decoration: none; }
        .logo-truck { color: #ffffff; } .logo-parts { color: #a8dadc; } .logo-xl { color: #e63946; }

        .nav-links { display: flex; gap: 25px; }
        .nav-links a { color: white; text-decoration: none; font-weight: bold; text-transform: uppercase; font-size: 0.85rem; }
        
        .header { background-color: rgba(255, 255, 255, 0.98); color: #1d3557; width: 100%; padding: 45px 0; text-align: center; border-bottom: 2px solid #e63946; }

        /* SEARCH SECTION */
        .search-wrapper { width: 95%; max-width: 900px; margin: -25px auto 40px; }
        .search { 
            width: 100%; padding: 18px; border-radius: 8px; border: 3px solid #39FF14; 
            background: white; font-size: 1.1rem; font-weight: bold; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .board-container { width: 95%; max-width: 900px; margin: 0 auto; flex-grow: 1; }
        .list { list-style: none; padding: 0; }

        /* CARDS */
        .post-card { background: white; color: #1d3557; margin-bottom: 15px; padding: 20px; border-radius: 10px; display: flex; flex-direction: column; position: relative; }
        
        .boosted { 
            background-color: #fbff00 !important; border: 4px solid #39FF14 !important; 
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.5); transform: scale(1.01);
        }
        .priority-badge { display: none; background: #e63946; color: white; padding: 4px 8px; font-size: 0.7rem; border-radius: 4px; position: absolute; top: -10px; left: 15px; }
        .boosted .priority-badge { display: block; }

        .part-name { font-size: 1.4rem; font-weight: 800; text-transform: uppercase; margin: 0; }
        .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; font-size: 0.9rem; }
        .label { font-weight: bold; color: #457b9d; }

        /* FOOTER */
        footer { background-color: #1d3557; color: white; width: 100%; padding: 40px 0; text-align: center; border-top: 2px solid #a8dadc; margin-top: 50px; }
        .footer-links a { color: #a8dadc; margin: 0 15px; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">
            <span class="logo-truck">TRUCK</span><span class="logo-parts">PARTS</span><span class="logo-xl">XL</span>
        </a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="board.html">Bounty Board</a>
            <a href="privacy.html">Privacy</a>
            <a href="terms.html">Terms</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <div class="header">
        <h1>Live Bounty Board</h1>
        <p>Real-time high-intent parts requests.</p>
    </div>

    <div id="bounty-engine">
        <div class="search-wrapper">
            <input class="search" placeholder="🔍 Search OEM#, Part Name, or Truck Model...">
        </div>

        <div class="board-container">
            <ul class="list" id="parts-data">
                <p style="text-align:center; color:white;">Loading active bounties...</p>
            </ul>
        </div>
    </div>

    <footer>
        <div class="footer-links">
            <a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms of Service</a> | <a href="contact.html">Contact & Support</a>
        </div>
    </footer>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTYrAOOtTGO2mCi3sqBNaWAoM8PM8srskGBywloCDjBAgTH9BwzWlhQiWM2KNWy3uzds53j8rCcIsPG/pub?gid=796391633&single=true&output=csv';

        async function fetchSheet() {
            try {
                const response = await fetch(CSV_URL);
                const text = await response.text();
                const rows = text.split('\n').slice(1);
                let html = '';

                rows.forEach(row => {
                    const cols = row.match(/(".*?"|[^",\r\n]+)(?=\s*,|\s*$)/g);
                    if (!cols || cols.length < 12) return;

                    const name = cols[1]?.replace(/"/g, '') || "N/A";
                    const oem = cols[2]?.replace(/"/g, '') || "N/A";
                    const cat = cols[3]?.replace(/"/g, '') || "N/A";
                    const truck = cols[4]?.replace(/"/g, '') || "N/A";
                    const boost = cols[11]?.replace(/"/g, '') || "";

                    const isBoosted = boost.includes("🚀");

                    html += `
                        <li class="post-card ${isBoosted ? 'boosted' : ''}">
                            <span class="priority-badge">🔥 PRIORITY BOUNTY</span>
                            <h3 class="part-name p-search">${name}</h3>
                            <div class="meta">
                                <div><span class="label">OEM:</span> <span class="o-search">${oem}</span></div>
                                <div><span class="label">CAT:</span> <span class="c-search">${cat}</span></div>
                                <div><span class="label">TRUCK:</span> <span class="t-search">${truck}</span></div>
                            </div>
                        </li>`;
                });

                document.getElementById('parts-data').innerHTML = html;
                new List('bounty-engine', { valueNames: ['p-search', 'o-search', 'c-search', 't-search'] });
            } catch (e) { console.error(e); }
        }
        fetchSheet();
    </script>
</body>
</html>
