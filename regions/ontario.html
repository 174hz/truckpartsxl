<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruckPartsXL | Golden Horseshoe & Ontario Boards</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fdfdfd; color: #2c3e50; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        nav { text-align: center; margin-bottom: 20px; padding: 10px; background: #f1f5f9; border-radius: 8px; }
        nav a { color: #0f766e; text-decoration: none; font-weight: 600; margin: 0 15px; }
        nav a:hover { text-decoration: underline; }
        header { text-align: center; margin-bottom: 40px; padding: 25px 0; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; }
        h1 { margin: 0; color: #0f172a; font-size: 2.4rem; font-weight: 800; }
        p.subtitle { color: #64748b; margin: 8px 0 0 0; font-size: 1.1rem; }
        .bounty-grid { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
        .post-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .data-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 22px; }
        .data-item { display: flex; justify-content: space-between; font-size: 0.9rem; padding-bottom: 6px; border-bottom: 1px solid #f1f5f9; }
        .label { color: #94a3b8; }
        .value { font-weight: 700; color: #334155; }
        .budget-value { color: #0f766e; background: #ccfbf1; padding: 2px 6px; border-radius: 4px; }
        .claim-btn { display: block; text-align: center; background: #1e293b; color: #fff; padding: 14px; margin-top: auto; border-radius: 8px; font-weight: 700; text-decoration: none; }
        .claim-btn:hover { background: #0f172a; }
        .no-results { text-align: center; padding: 4px; color: #64748b; font-style: italic; grid-column: 1 / -1; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="../board.html">🏠 Back to Global Home</a>
            <a href="rust-belt.html">🇺🇸 Switch to Rust Belt Board</a>
        </nav>

        <header>
            <h1>Ontario Freight Sourcing Registry</h1>
            <p class="subtitle">GTA, Golden Horseshoe, and Local Highway 401 Fleet Bounties</p>
        </header>
        
        <ul class="bounty-grid" id="bountyGrid">
            </ul>
    </div>

    <script>
        const SHEET_ID = '1X58f_e_5Y268_2G077U9FpTki79Xl8x_1p7DbyyV5w4';
        const TAB_NAME = 'Active_Bounties';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(TAB_NAME)}`;

        document.addEventListener('DOMContentLoaded', fetchBountyBoardData);

        async function fetchBountyBoardData() {
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('Spreadsheet dynamic parse fault.');
                const csvText = await response.text();
                renderBountyCards(parseCSV(csvText));
            } catch (error) {
                console.error("Local backup sequence initiated:", error);
            }
        }

        function parseCSV(text) {
            let lines = []; let row = []; let inQuotes = false; let currentToken = '';
            for (let i = 0; i < text.length; i++) {
                let char = text[i]; let nextChar = text[i+1];
                if (char === '"') { if (inQuotes && nextChar === '"') { currentToken += '"'; i++; } else { inQuotes = !inQuotes; } }
                else if (char === ',' && !inQuotes) { row.push(currentToken.trim()); currentToken = ''; }
                else if ((char === '\r' || char === '\n') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') i++;
                    row.push(currentToken.trim());
                    if (row.length > 0 && row.some(c => c !== '')) lines.push(row);
                    row = []; currentToken = '';
                } else { currentToken += char; }
            }
            if (currentToken || row.length > 0) { row.push(currentToken.trim()); lines.push(row); }
            return lines;
        }

        function renderBountyCards(data) {
            const gridContainer = document.getElementById('bountyGrid');
            if (!gridContainer) return;
            gridContainer.innerHTML = '';

            const headers = data[0].map(h => h.toLowerCase().replace(/["']/g, "").trim());
            
            const idxPartName = headers.findIndex(h => h === 'part' || h === 'part name' || h.includes('looking for'));
            const idxMake     = headers.findIndex(h => h === 'make' || h.includes('manufacturer'));
            const idxModel    = headers.findIndex(h => h === 'model' || h.includes('series'));
            const idxYear     = headers.findIndex(h => h === 'year' || h.includes('model year'));
            const idxCategory = headers.findIndex(h => h === 'category' || h.includes('component'));
            const idxOem      = headers.findIndex(h => h.includes('oem') || h.includes('casting') || h.includes('number'));
            const idxLocation = headers.findIndex(h => h === 'location'); 
            const idxBudget   = headers.findIndex(h => h === 'budget' || h.includes('target'));

            let totalRendered = 0;
            const dataRows = data.slice(1);

            dataRows.forEach(row => {
                const location = (idxLocation !== -1 && row[idxLocation]) ? row[idxLocation] : '';
                const locLower = location.toLowerCase();
                
                const isOntario = locLower.includes('on') || 
                                  locLower.includes('toronto') || 
                                  locLower.includes('peterborough') || 
                                  locLower.includes('oshawa') || 
                                  locLower.includes('millbrook');
                
                if (!isOntario) return;

                const partName = idxPartName !== -1 ? row[idxPartName] : 'Component Assembly';
                const make     = idxMake     !== -1 ? row[idxMake]     : '';
                const model    = idxModel    !== -1 ? row[idxModel]    : '';
                const year     = idxYear     !== -1 ? row[idxYear]     : '';
                const category = idxCategory !== -1 ? row[idxCategory] : 'Fleet Mechanics';
                const oem      = idxOem      !== -1 ? row[idxOem]      : 'N/A';
                const budget   = idxBudget   !== -1 ? row[idxBudget]   : 'Contact Desk';

                totalRendered++;

                let html = `
                    <li class="post-card">
                        <h3 class="part-title">${partName}</h3>
                        <div class="vehicle-fitment">${year} ${make} ${model}</div>
                        <div class="data-grid">
                            <div class="data-item"><span class="label">OEM / Casting Number</span><span class="value">${oem}</span></div>
                            <div class="data-item"><span class="label">Category Component</span><span class="value">${category}</span></div>
                            <div class="data-item"><span class="label">Location</span><span class="value">${location}</span></div>
                            <div class="data-item"><span class="label">Target Budget</span><span class="value budget-value">${budget}</span></div>
                        </div>
                        <a href="https://docs.google.com/forms/d/e/1FAIpQLSdvaFtu1j7WZ45LO4zlJYk0znBr8I5lvxZmwDfMQUfxcFR0Eg/viewform?usp=pp_url&entry.784460779=${encodeURIComponent(oem)}" 
                           target="_blank" class="claim-btn">
                           ⚡ Secure Match: Connect with Buyer
                        </a>
                    </li>`;
                gridContainer.insertAdjacentHTML('beforeend', html);
            });

            if (totalRendered === 0) {
                gridContainer.innerHTML = '<li class="no-results">No active local Ontario requests listed.</li>';
            }
        }
    </script>
</body>
</html>
